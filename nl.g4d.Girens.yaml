app-id: nl.g4d.Girens
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: girens
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --own-name=org.mpris.MediaPlayer2.Girens
  - --talk-name=org.freedesktop.secrets
  - --metadata=X-DConf=migrate-path=/nl/g4d/Girens/
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: ffmpeg
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --disable-ffplay
      - --enable-version3
      - --enable-demuxer=dash
      - --enable-libxml2
      - --disable-programs
      - --disable-encoders
      - --disable-muxers
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg
        tag: n9.0.2
        commit: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Dlibarchive=enabled
      - -Dshaderc=disabled
      - -Dvulkan=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
        x-checker-data:
          type: git
    modules:
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
            x-checker-data:
              type: anitya
              project-id: 1560
              stable-only: true
              url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz
        modules:
          - name: fribidi
            cleanup:
              - /bin
              - /include
              - /lib/pkgconfig
              - /lib/*.la
              - /share/man
            sources:
              - type: archive
                url: https://github.com/fribidi/fribidi/releases/download/v1.0.18/fribidi-1.0.18.tar.xz
                sha256: 1de5e8073d035388b71d0b2d452b1da1f8caeea8a7702997b401fe1b6250727f
                x-checker-data:
                  type: anitya
                  project-id: 857
                  stable-only: true
                  url-template: https://github.com/fribidi/fribidi/releases/download/v$version/fribidi-$version.tar.xz
          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Dvulkan=enabled
              - -Dshaderc=disabled
            cleanup:
              - /lib/pkgconfig
              - /include
            sources:
              - type: git
                url: https://code.videolan.org/videolan/libplacebo.git
                tag: v7.387.0
                commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
                x-checker-data:
                  type: git
            modules:
              - name: glslang
                buildsystem: cmake-ninja
                builddir: true
                config-opts:
                  - -DBUILD_SHARED_LIBS=ON
                  - -DENABLE_OPT=OFF
                cleanup:
                  - /bin
                  - /lib/cmake
                  - /include
                sources:
                  - type: archive
                    archive-type: tar
                    url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.6.0.tar.gz
                    sha256: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2
                    x-checker-data:
                      type: anitya
                      project-id: 205796
                      stable-only: true
                      url-template: https://github.com/KhronosGroup/glslang/archive/refs/tags/$version.tar.gz
  - name: girens
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dbuildtype=release
      - -Dnetwork_tests=false
    builddir: true
    build-options:
      env:
        # The crates of cargo-sources.json are unpacked here; see
        # build-aux/cargo-sources.py in the source tree.
        CARGO_HOME: /run/build/girens/cargo
    sources:
      - type: git
        url: https://gitlab.gnome.org/tijder/girens
        commit: 533b540fbf0c681baf5b6a18ddf3b2ecd9ed5730
      - cargo-sources.json
      # libmpv2 7.0.0 assumes that C's char is signed, which it is not on
      # aarch64; without this it does not compile there.
      - type: shell
        commands:
          - sed -i 's/\*const i8,/*const std::ffi::c_char,/' cargo/vendor/libmpv2-7.0.0/src/mpv.rs
          - grep -q 'const std::ffi::c_char,' cargo/vendor/libmpv2-7.0.0/src/mpv.rs
